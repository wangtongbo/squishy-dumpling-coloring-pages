    <!-- dumpling body -->
    <path d="M 180 640 C 200 480 320 380 400 380 C 480 380 600 480 620 640 C 620 710 520 730 400 730 C 280 730 180 710 180 640 Z"/>
    <!-- pleats -->
    <path d="M 290 415 Q 305 465 295 505" fill="none"/>
    <path d="M 350 388 Q 365 445 355 490" fill="none"/>
    <path d="M 400 380 Q 400 440 400 485" fill="none"/>
    <path d="M 450 388 Q 435 445 445 490" fill="none"/>
    <path d="M 510 415 Q 495 465 505 505" fill="none"/>
    <!-- eyes -->
    <circle cx="335" cy="575" r="15" fill="black" stroke="none"/>
    <circle cx="465" cy="575" r="15" fill="black" stroke="none"/>
    <circle cx="340" cy="570" r="4" fill="white" stroke="none"/>
    <circle cx="470" cy="570" r="4" fill="white" stroke="none"/>
    <!-- smile -->
    <path d="M 365 640 Q 400 668 435 640" fill="none"/>
